<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Zoe's Games</title><meta name="theme-color" content="#ff9ccf">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Zoe's Games">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ff9ccf url(hub/bg.jpg) center/cover no-repeat;font-family:system-ui,sans-serif}
#app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;
 padding:2vmin 3vmin;padding:max(2vmin,env(safe-area-inset-top)) max(3vmin,env(safe-area-inset-right)) max(2vmin,env(safe-area-inset-bottom)) max(3vmin,env(safe-area-inset-left))}
#host{flex:0 0 auto;width:24vmin;height:24vmin;border-radius:50%;border:1.2vmin solid #fff;background:#fff center/cover;
 box-shadow:0 1vmin 3vmin #0004;animation:bob 2.4s ease-in-out infinite;cursor:pointer;position:relative;margin-right:3vmin}
#host.talk{animation:talk .25s ease-in-out 6}
.hb #host{display:block}.nh #host{display:none}
#grid{display:grid;grid-gap:3vmin;gap:3vmin;grid-template-columns:repeat(var(--c),1fr);max-width:100%}
.t{width:var(--s);height:var(--s);border-radius:5vmin;background:#fff center/cover no-repeat;border:1.4vmin solid #fff;
 box-shadow:0 1.2vmin 0 #0002,0 1.5vmin 3vmin #0004;cursor:pointer;transition:transform .15s;position:relative}
.t:active{transform:scale(.94)}
.t.go{animation:pop .7s ease-out forwards}
.alex .t{border-color:#7a4a22;border-radius:3vmin;box-shadow:0 1.2vmin 0 #4a2a10,0 1.5vmin 3vmin #0006}
.alex .t::after{content:"";position:absolute;top:-.6vmin;right:-.6vmin;bottom:-.6vmin;left:-.6vmin;border-radius:2.6vmin;border:.5vmin dashed #e9c47a;pointer-events:none}
.zoe .t{border-color:#fff;outline:.8vmin solid #ffb6dd}
#sign{flex:0 0 auto;font-size:15vmin;filter:drop-shadow(0 1vmin 1vmin #0005);animation:bob 2.4s ease-in-out infinite;cursor:pointer;margin-right:3vmin}
@keyframes bob{50%{transform:translateY(-1.5vmin) rotate(-3deg)}}
@keyframes talk{50%{transform:scale(1.08) rotate(4deg)}}
@keyframes pop{30%{transform:scale(1.12) rotate(-3deg)}100%{transform:scale(1.05)}}
#ok{position:fixed;right:max(1.5vmin,env(safe-area-inset-right));bottom:max(1vmin,env(safe-area-inset-bottom));font-size:3vmin;opacity:.75}
@media (orientation:portrait){#app{flex-direction:column}#host,#sign{width:20vmin;height:20vmin;margin:0 0 3vmin 0}}
#bd{position:fixed;top:0;right:0;bottom:0;left:0;z-index:99;background:#ffe3f3e6;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;overflow:hidden;transition:opacity .6s}
#bd .k{font-size:38vmin;animation:bob 1.6s ease-in-out infinite}#bd .p{font-size:12vmin;animation:talk .8s ease-in-out infinite}
#bd i{position:absolute;top:-10vmin;font-style:normal;font-size:6vmin;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
#intro{position:fixed;top:0;right:0;bottom:0;left:0;z-index:99;overflow:hidden;cursor:pointer;transition:opacity .5s;background:radial-gradient(circle at 50% 60%,#ff9ad5,#b04fd8 60%,#3a1a78)}
#intro span,#intro div{position:absolute}
.th-stars,.th-castle,.th-fireworks{background:radial-gradient(circle at 50% 80%,#3b2a8f,#120a3a 70%)!important}
.th-rainbow,.th-unicorn{background:linear-gradient(#7fd3ff,#d8f2ff 70%,#fff)!important}
.th-birthday{background:radial-gradient(circle,#fff0f8,#ffb6dd)!important}
.th-zoe{background:radial-gradient(circle,#fff6b0,#ff9ccf 75%)!important}
#intro .tw{animation:tw 1.6s ease-in-out infinite;-webkit-animation:tw 1.6s ease-in-out infinite;opacity:0}
@keyframes tw{50%{opacity:1;transform:scale(1.3) rotate(20deg)}}@-webkit-keyframes tw{50%{opacity:1;-webkit-transform:scale(1.3) rotate(20deg)}}
#intro .dogw{left:50%;top:50%;width:34vmin;height:34vmin;margin:-24vmin 0 0 -17vmin;animation:burst 1s cubic-bezier(.2,1.6,.4,1) .9s both;-webkit-animation:burst 1s cubic-bezier(.2,1.6,.4,1) .9s both}
#intro .dog{top:0;left:0;width:100%;height:100%;border-radius:50%;border:1.4vmin solid #fff;background:#fff center/cover;box-shadow:0 0 0 1vmin #ffd93b,0 0 6vmin 2vmin #fff;animation:bob 1.2s ease-in-out 2s infinite;-webkit-animation:bob 1.2s ease-in-out 2s infinite}
@keyframes burst{0%{transform:scale(0) rotate(-540deg);opacity:0}100%{transform:none;opacity:1}}@-webkit-keyframes burst{0%{-webkit-transform:scale(0) rotate(-540deg);opacity:0}100%{-webkit-transform:none;opacity:1}}
.th-unicorn .dogw,.th-rainbow .dogw{animation-name:slidein!important;-webkit-animation-name:slidein!important}
@keyframes slidein{0%{transform:translateX(-120vw) rotate(-60deg)}100%{transform:none}}@-webkit-keyframes slidein{0%{-webkit-transform:translateX(-120vw) rotate(-60deg)}100%{-webkit-transform:none}}
#intro .msg{left:0;right:0;bottom:12%;text-align:center;font:900 14vmin/1 system-ui,-apple-system,sans-serif;color:#fff;-webkit-text-stroke:.5vmin #d63384;text-shadow:0 1vmin 0 #9b1f63,0 0 4vmin #fff8}
#intro.th-birthday .msg{font-size:9vmin}#intro .msg .w{position:static;display:inline-block;white-space:nowrap}
#intro .msg .l{position:static;display:inline-block;animation:lp .5s cubic-bezier(.2,1.8,.5,1) both;-webkit-animation:lp .5s cubic-bezier(.2,1.8,.5,1) both}
@keyframes lp{0%{transform:translateY(8vmin) scale(0);opacity:0}100%{transform:none;opacity:1}}@-webkit-keyframes lp{0%{-webkit-transform:translateY(8vmin) scale(0);opacity:0}100%{-webkit-transform:none;opacity:1}}
#intro .tap{right:3vmin;bottom:3vmin;font-size:7vmin;animation:talk .8s ease-in-out infinite;-webkit-animation:talk .8s ease-in-out infinite}
#intro .cnt{font-size:10vmin;animation:lp .5s cubic-bezier(.2,1.8,.5,1) both;-webkit-animation:lp .5s cubic-bezier(.2,1.8,.5,1) both}
#intro .cnt b{position:absolute;left:0;right:0;top:28%;text-align:center;font:900 4.5vmin system-ui,sans-serif;color:#7a3b00}
#intro .rb{left:50%;top:62%;width:120vmin;height:120vmin;margin-left:-60vmin;border-radius:50%;
 box-shadow:inset 0 0 0 4vmin #ff5a5a,inset 0 0 0 8vmin #ffa53b,inset 0 0 0 12vmin #ffe14d,inset 0 0 0 16vmin #6ee06e,inset 0 0 0 20vmin #4fb4ff,inset 0 0 0 24vmin #a46bff;
 animation:rbg 1.2s ease-out both;-webkit-animation:rbg 1.2s ease-out both}
@keyframes rbg{0%{transform:scale(0);opacity:0}100%{transform:none;opacity:1}}@-webkit-keyframes rbg{0%{-webkit-transform:scale(0);opacity:0}100%{-webkit-transform:none;opacity:1}}
#intro .cl{font-size:20vmin;animation:lp .8s ease-out both;-webkit-animation:lp .8s ease-out both}
#intro .cs{left:50%;bottom:-2%;font-size:60vmin;line-height:1;margin-left:-30vmin;opacity:.55;animation:rise 1.4s ease-out both;-webkit-animation:rise 1.4s ease-out both}
@keyframes rise{0%{transform:translateY(60vmin)}100%{transform:none}}@-webkit-keyframes rise{0%{-webkit-transform:translateY(60vmin)}100%{-webkit-transform:none}}
#intro .mn{right:8%;top:6%;font-size:14vmin}
#intro .trail{left:0;top:30%;height:6vmin;width:100%;background:linear-gradient(#ff5a5a,#ffa53b,#ffe14d,#6ee06e,#4fb4ff,#a46bff);transform-origin:0 0;-webkit-transform-origin:0 0;animation:tr 1.6s ease-in-out both;-webkit-animation:tr 1.6s ease-in-out both;border-radius:3vmin}
@keyframes tr{0%{transform:scaleX(0)}100%{transform:none}}@-webkit-keyframes tr{0%{-webkit-transform:scaleX(0)}100%{-webkit-transform:none}}
#intro .uni{top:16%;left:0;font-size:20vmin;animation:gal 1.6s ease-in-out both;-webkit-animation:gal 1.6s ease-in-out both}
@keyframes gal{0%{transform:translateX(-25vmin)}100%{transform:translateX(105vw)}}@-webkit-keyframes gal{0%{-webkit-transform:translateX(-25vmin)}100%{-webkit-transform:translateX(105vw)}}
#intro .cake{left:6%;bottom:6%;font-size:24vmin;animation:bob 1.4s ease-in-out infinite;-webkit-animation:bob 1.4s ease-in-out infinite}
#intro .fall2{top:-10vmin;font-size:6vmin;animation:fall linear infinite;-webkit-animation:fall linear infinite}
#intro .fw{width:0;height:0}#intro .fw i{position:absolute;left:0;top:0;width:0;height:0}
#intro .fw u{position:absolute;left:-1vmin;top:-1vmin;width:2vmin;height:2vmin;border-radius:50%;opacity:0;box-shadow:0 0 2vmin #fff;animation:boom 1.3s ease-out both;-webkit-animation:boom 1.3s ease-out both}
@keyframes boom{0%{transform:none;opacity:1}70%{opacity:1}100%{transform:translateY(-16vmin) scale(.3);opacity:0}}@-webkit-keyframes boom{0%{-webkit-transform:none;opacity:1}70%{opacity:1}100%{-webkit-transform:translateY(-16vmin) scale(.3);opacity:0}}
#intro .big{top:6%;font:900 22vmin/1 system-ui,sans-serif;color:#fff;-webkit-text-stroke:.6vmin #6b2bd6;text-shadow:0 1.2vmin 0 #6b2bd6;animation:lp .6s cubic-bezier(.2,1.8,.5,1) both;-webkit-animation:lp .6s cubic-bezier(.2,1.8,.5,1) both}
#intro.rm *{animation:none!important;-webkit-animation:none!important;opacity:1!important;transform:none!important;-webkit-transform:none!important}
#intro.rm .fw,#intro.rm .tw,#intro.rm .fall2,#intro.rm .uni,#intro.rm .tap{display:none}
@media (orientation:portrait){#intro .msg{font-size:13vw}.th-birthday #intro .msg,#intro.th-birthday .msg{font-size:9vw}#intro .cnt{font-size:9vw}}
</style></head><body class="zoe"><div id="app">
<div id="host" style="background-image:url(hub/host.png)"></div><div id="sign">🧭</div><div id="grid"></div></div><div id="ok"></div>
<script>
/*framed-games*/var fw=null;
function sizeF(){if(!fw)return;fw.style.width=innerWidth+'px';fw.style.height=innerHeight+'px';var f=fw.firstChild;f.style.width=innerWidth+'px';f.style.height=innerHeight+'px'}
function openGame(h){if(self!==top||!window.postMessage){location.href=h;return}
 try{if(cur)cur.pause()}catch(e){}
 fw=document.createElement('div');fw.style.cssText='position:fixed;left:0;top:0;z-index:99999;overflow:hidden;background:#000';
 var f=document.createElement('iframe');f.src=h;f.setAttribute('allow','autoplay; fullscreen');f.setAttribute('allowfullscreen','');f.setAttribute('scrolling','no');
 f.style.cssText='display:block;border:0;margin:0;padding:0';fw.appendChild(f);document.body.appendChild(fw);sizeF();
 setTimeout(function(){try{f.focus()}catch(e){}},300)}
function closeGame(){if(!fw)return;fw.parentNode.removeChild(fw);fw=null;busy=false;document.querySelectorAll('.go').forEach(function(x){x.classList.remove('go')})}
addEventListener('resize',sizeF);addEventListener('orientationchange',function(){setTimeout(sizeF,300)});
addEventListener('message',function(e){if(e.origin===location.origin&&e.data==='hubClose')closeGame()});
if(self!==top){try{parent.postMessage('hubClose',location.origin)}catch(e){}}

var T=[{"href": "play/", "img": "hub/doodle-and-zoe.png", "clip": "hub/z_dz.mp3"}, {"href": "/zoes-princess-castle/", "img": "hub/zoes-princess-castle.png", "clip": "hub/z_pc.mp3"}, {"href": "/zoes-unicorn-adventure/", "img": "hub/zoes-unicorn-adventure.png", "clip": "hub/z_ua.mp3"}, {"href": "/wilson-water-pirates/", "img": "hub/wilson-water-pirates.png", "clip": "hub/z_wp.mp3"}, {"href": "/the-bee-game/", "img": "hub/the-bee-game.png", "clip": "hub/z_bg.mp3"}],KID="zoe",HASHOST=1;
document.body.classList.add(HASHOST?'hb':'nh');
document.getElementById(HASHOST?'sign':'host').remove();
var g=document.getElementById('grid'),cur=null,busy=false;
function play(src){try{if(cur){cur.pause()}cur=new Audio(src);cur.play().catch(function(){})}catch(e){}return cur}
function talk(){var h=document.getElementById('host')||document.getElementById('sign');h.classList.remove('talk');void h.offsetWidth;h.classList.add('talk')}
function lay(){var w=innerWidth,h=innerHeight,n=T.length,port=h>w;
 var c=port?2:(n<=4?(w/h>1.9?4:2):(w/h>1.9?5:3)),r=Math.ceil(n/c);
 var aw=port?w*.9:w*.68,ah=port?h*.62:h*.86;
 var s=Math.min((aw-(c-1)*Math.min(w,h)*.03)/c,(ah-(r-1)*Math.min(w,h)*.03)/r,330);
 g.style.setProperty('--c',c);g.style.setProperty('--s',s+'px')}
T.forEach(function(t,i){var d=document.createElement('div');d.className='t';d.style.backgroundImage='url('+t.img+')';
 d.setAttribute('role','link');d.setAttribute('aria-label',t.href);
 d.addEventListener('click',function(){if(busy)return;busy=true;d.classList.add('go');talk();var a=play(t.clip);
  try{localStorage.kidsHub=KID}catch(e){}
  var gone=false;function go(){if(gone)return;gone=true;openGame(t.href)}
  if(a)a.onended=go;setTimeout(go,1400);setTimeout(function(){busy=false},3000)});
 g.appendChild(d)});
lay();addEventListener('resize',lay);
var greeted=false;function busyV(){return cur&&!cur.paused&&!cur.ended}
function hi(){if(greeted||busyV())return;greeted=true;talk();play(HICLIP)}
(document.getElementById('host')||document.getElementById('sign')).addEventListener('click',function(){greeted=false;hi()});
addEventListener('pointerdown',function(e){if(!e.target.classList.contains('t'))hi()},{once:true});
addEventListener('pageshow',function(){busy=false;document.querySelectorAll('.go').forEach(function(x){x.classList.remove('go')})});
var BD="hub/z_bd.mp3",HICLIP='hub/z_hi.mp3';
/*epic-intro: daily-rotating, tap-to-skip cinematic (Zoe only)*/
(function(){if(KID!=='zoe')return;
var TH=['stars','rainbow','castle','fireworks','unicorn','zoe','stars2'],BDAY='birthday';
var d=new Date(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),q=(location.search.match(/[?&]intro=(\w+)/)||[])[1];
var th=q||(doy%8===3&&BD?BDAY:TH[doy%TH.length]);if(q==='off')return;
if(th==='stars2')th='stars';
if(th===BDAY)HICLIP=BD;
var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var o=document.createElement('div');o.id='intro';o.className='th-'+th+(rm?' rm':'');
var H='',i,E;
function sp(t,cls,st){return '<span class="'+cls+'" style="'+st+'">'+t+'</span>'}
function rnd(a,b){return a+Math.random()*(b-a)}
// background sparkles for all themes
for(i=0;i<22;i++)H+=sp(['✨','⭐','💫'][i%3],'tw','left:'+rnd(2,96)+'%;top:'+rnd(2,90)+'%;font-size:'+rnd(3,6)+'vmin;-webkit-animation-delay:'+rnd(0,2)+'s;animation-delay:'+rnd(0,2)+'s');
if(th==='stars'){for(i=0;i<5;i++)H+=sp('⭐<b>'+(i+1)+'</b>','cnt','left:'+(14+i*16)+'%;top:'+(i%2?14:24)+'%;-webkit-animation-delay:'+(.4+i*.45)+'s;animation-delay:'+(.4+i*.45)+'s')}
if(th==='rainbow'){H+='<div class="rb"></div>';for(i=0;i<5;i++)H+=sp('☁️','cl','left:'+(i*22)+'%;bottom:'+rnd(-4,6)+'%;-webkit-animation-delay:'+(i*.15)+'s;animation-delay:'+(i*.15)+'s')}
if(th==='castle'){H+=sp('🏰','cs','');H+=sp('🌙','mn','')}
if(th==='unicorn'){H+='<div class="trail"></div>'+sp('🦄','uni','')}
if(th===BDAY){H+=sp('🎂','cake','');E=['🎉','🎈','🎊','💖','⭐','🎁'];for(i=0;i<24;i++)H+=sp(E[i%6],'fall2','left:'+rnd(0,98)+'%;-webkit-animation-duration:'+rnd(2.5,4.5)+'s;animation-duration:'+rnd(2.5,4.5)+'s;-webkit-animation-delay:'+(-rnd(0,3))+'s;animation-delay:'+(-rnd(0,3))+'s')}
if(th==='fireworks'||th==='castle'||th===BDAY){var C=['#ff4fa3','#ffd93b','#5fd4ff','#a66bff','#7cf27c'];
 for(var f=0;f<5;f++){var x=rnd(10,90),y=rnd(8,40),dl=.5+f*.55;H+='<div class="fw" style="left:'+x+'%;top:'+y+'%">';
  for(i=0;i<12;i++)H+='<i style="-webkit-transform:rotate('+(i*30)+'deg);transform:rotate('+(i*30)+'deg)"><u style="background:'+C[(f+i)%5]+';-webkit-animation-delay:'+dl+'s;animation-delay:'+dl+'s"></u></i>';H+='</div>'}}
if(th==='zoe'){var L=['Z','O','E'];for(i=0;i<3;i++)H+=sp(L[i],'big','left:'+(22+i*22)+'%;-webkit-animation-delay:'+(.3+i*.6)+'s;animation-delay:'+(.3+i*.6)+'s')}
var msg=th===BDAY?'Happy Birthday, Zoe!':'Hi Zoe!',m='';
m='<span class="w">';for(i=0;i<msg.length;i++)m+=msg[i]===' '?'</span> <span class="w">':sp(msg[i],'l','-webkit-animation-delay:'+(2.3+i*.07)+'s;animation-delay:'+(2.3+i*.07)+'s');
m+='</span>';H+='<div class="dogw"><div class="dog" style="background-image:url(hub/host.png)"></div></div><div class="msg">'+m+'</div><div class="tap">👆</div>';
o.innerHTML=H;document.body.appendChild(o);
var done=false;function end(){if(done)return;done=true;o.style.opacity=0;setTimeout(function(){if(o.parentNode)o.parentNode.removeChild(o)},500)}
o.addEventListener('pointerdown',function(){setTimeout(end,80)});o.addEventListener('click',end);
setTimeout(end,rm?2500:5600)})();
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready}).then(function(){document.getElementById('ok').textContent='✈️✓'}).catch(function(){})}
</script></body></html>
